name: SEED r3 P3 page and regression evidence
on:
  push:
    branches: [seed-r3-p2p3]
    paths:
      - '.github/workflows/seed-r3-p3.yml'
      - 'web/preview/app.js'
      - 'web/preview/clan.js'
      - 'web/preview/clan.css'
      - 'web/preview/style.css'
      - 'web/preview/qa/p3-*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Browser 40 screenshot matrix computed styles and functionality
        run: |
          node --check web/preview/app.js
          node --check web/preview/clan.js
          node --check web/preview/qa/p3-render.cjs
          python3 -m http.server 8001 --directory web/preview >/tmp/seed-p3.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/qa/p3-dressing.html >/dev/null; then break; fi
            sleep 1
          done
          node web/preview/qa/p3-render.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seed-r3-p3-render-matrix
          path: docs/design/evidence/p3/
          if-no-files-found: warn
      - name: Commit verified P3 screenshot and computed evidence
        if: success()
        run: |
          git config user.name 'seed-r3-qa[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/design/evidence/p3/
          if git diff --cached --quiet; then echo 'P3 Evidence already committed'; else
            git commit -m 'test(seed-r3/P3): capture 40 actual layouts and contextual item screenshots'
            git push origin HEAD:seed-r3-p2p3
          fi
