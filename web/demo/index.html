<!doctype html>
<html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>갓생패치 · 페이지 템플릿</title><link rel="stylesheet" href="./shell.css"></head><body>
<div class="shell" id="shell"><header class="header" id="header"></header><main id="content" class="content" tabindex="-1"></main><div class="bottom" id="bottom"><div id="footer" class="footer-actions" hidden></div><nav id="nav" class="nav" aria-label="주 메뉴"></nav></div></div>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title" data-snap="min"><button class="grip" aria-label="시트 높이 변경" id="grip"></button><h2 id="sheet-title">표시 설정</h2><div class="sheet-body"><p class="support">현재 페이지를 유지한 채 설정을 바꿀 수 있어요.</p><label class="switch">다크 모드<input id="theme" type="checkbox" role="switch" checked><span class="track"></span></label><div class="group" id="sheetChoices"></div></div><div class="sheet-footer"><button class="cta" data-close>닫기</button></div></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">템플릿 확인</h2><p class="support">실제 데이터는 변경되지 않아요.</p><button class="cta" data-close>확인</button></dialog>
<script src="./app.js" defer></script></body></html>
