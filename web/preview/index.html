<!doctype html>
<html lang="ko" data-seed-lab data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="description" content="갓생패치 퀘스트, 클랜과 마스코트의 웹 시연">
  <title>갓생패치</title>
  <link rel="stylesheet" href="../../seed/styles/seed-standard.css">
  <link rel="stylesheet" href="./preview.css?v=clan-crest-v14">
  <script type="module" src="./app.mjs?v=clan-crest-v14"></script>
</head>
<body>
  <div class="seed-page-shell preview-shell">
    <header class="seed-page-shell__header seed-top-nav">
      <div class="seed-top-nav__inner" data-nav-role="root">
        <div class="seed-top-nav__leading"></div>
        <h1 class="seed-top-nav__title">홈</h1>
        <div class="seed-top-nav__trailing"></div>
      </div>
    </header>
    <main class="seed-page-shell__content preview-content" id="main" tabindex="-1"></main>
    <div class="seed-page-shell__bottom" data-bottom-role="navigation">
      <nav class="seed-bottom-nav" aria-label="주 탐색"></nav>
    </div>
    <div class="preview-notice" role="status" aria-live="polite"></div>
  </div>
  <dialog id="home-alerts" class="seed-sheet home-alerts" aria-labelledby="home-alerts-title">
    <div class="seed-sheet__head">
      <h2 id="home-alerts-title" class="seed-text" data-text-role="section" data-text-style="section">알림</h2>
      <button type="button" class="seed-icon-action" aria-label="알림 닫기" data-shell-action="close-alerts"><span class="seed-icon" aria-hidden="true" style="--seed-icon:url('../../assets/icons/soft/v0.14/close.svg')"></span></button>
    </div>
    <div class="seed-sheet__body" id="home-alert-list"></div>
  </dialog>
  <dialog id="chat-room-info" class="chat-modal" aria-labelledby="chat-room-info-title">
    <div class="chat-modal__head"><h2 id="chat-room-info-title">대화방 정보</h2><button type="button" class="seed-icon-action" data-shell-action="close-chat-room-info" aria-label="닫기"><span class="seed-icon" aria-hidden="true" style="--seed-icon:url('../../assets/icons/soft/v0.14/close.svg')"></span></button></div>
    <p id="chat-room-info-body"></p>
  </dialog>
  <dialog id="chat-message-sheet" class="chat-message-sheet" aria-labelledby="chat-message-sheet-title">
    <span class="chat-message-sheet__grabber" aria-hidden="true"></span>
    <div class="chat-message-sheet__head"><strong id="chat-message-sheet-title">메시지</strong>
      <button type="button" class="seed-icon-action" data-shell-action="close-chat-message-sheet" aria-label="메뉴 닫기"><span class="seed-icon" aria-hidden="true" style="--seed-icon:url('../../assets/icons/soft/v0.14/close.svg')"></span></button>
    </div>
    <div id="chat-message-sheet-actions" class="chat-message-sheet__actions"></div>
  </dialog>
  <dialog id="chat-photo-viewer" class="chat-modal chat-photo-modal" aria-label="사진 보기">
    <div class="chat-modal__head"><strong>사진</strong><button type="button" class="seed-icon-action" data-shell-action="close-chat-photo" aria-label="닫기"><span class="seed-icon" aria-hidden="true" style="--seed-icon:url('../../assets/icons/soft/v0.14/close.svg')"></span></button></div>
    <img id="chat-photo-viewer-image" alt="크게 표시한 사진">
  </dialog>
  <noscript>웹 시연을 이용하려면 JavaScript를 켜 주세요.</noscript>
</body>
</html>
