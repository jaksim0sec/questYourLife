name: Android Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Best-effort persistence for updates between preview APKs.
      # This cache may expire. A stable release key belongs in GitHub Secrets.
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: questyourlife-debug-signing-v1

      # Persistent signing requires PREVIEW_DEBUG_KEYSTORE_B64 in repository Secrets.
      # The secret is the base64 encoding of the previous debug.keystore.
      - name: Restore permanent signing key when configured
        env:
          PREVIEW_DEBUG_KEYSTORE_B64: ${{ secrets.PREVIEW_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$PREVIEW_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$PREVIEW_DEBUG_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "Fixed signing keystore restored from GitHub Secrets."
          else
            echo "::warning::No PREVIEW_DEBUG_KEYSTORE_B64 secret. Debug signing depends on temporary cache, APK update compatibility is not guaranteed."
          fi

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Publish debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hyunsaengpatch-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
