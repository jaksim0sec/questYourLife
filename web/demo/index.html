<!doctype html>
<html lang="ko" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>갓생패치 · 페이지 템플릿</title><style>
:root{color-scheme:dark;--canvas:#141414;--surface:#202020;--soft:#2c2c2c;--line:#383838;--fg:#f6f6f6;--sub:#adadad;--brand:#db3040;--on-brand:#fff;--gold:#957027;--on-gold:#fff;--gutter:1.25rem;--ease:cubic-bezier(.2,.8,.2,1);font-family:"Pretendard Variable","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:100%;background:var(--canvas);color:var(--fg)}
:root[data-theme=light]{color-scheme:light;--canvas:#f6f6f6;--surface:#fff;--soft:#eee;--line:#e0e0e0;--fg:#212121;--sub:#717171;--gold:#ffcc4d;--on-gold:#352713}
*{box-sizing:border-box}body{margin:0}button,input,a{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:3px}button:disabled{opacity:.45;cursor:default}h1,h2,p{margin:0}h1,h2{overflow-wrap:anywhere}[hidden]{display:none!important}
.shell{width:min(100%,35rem);height:100dvh;margin:auto;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:var(--canvas)}
.header{padding:env(safe-area-inset-top,0px) var(--gutter) 0;min-width:0}.head{display:grid;align-items:center;gap:.5rem;min-height:3.5rem}.head.root{grid-template-columns:minmax(0,1fr) auto;min-height:4.75rem}.head.root h1{font-size:1.875rem;line-height:1.22;font-weight:800;letter-spacing:-.04em}.head.standard{grid-template-columns:minmax(3rem,1fr) minmax(0,auto) minmax(3rem,1fr)}.head.standard h1{font-size:1.08rem;font-weight:650;letter-spacing:-.018em;text-align:center}.head.standard[data-align=start]{grid-template-columns:3rem minmax(0,1fr) auto}.head.standard[data-align=start] h1{text-align:left}.head .end{display:flex;justify-content:flex-end}.icon{width:1.5rem;height:1.5rem;display:inline-block;flex:none;background:currentColor;mask:var(--icon) center/contain no-repeat;-webkit-mask:var(--icon) center/contain no-repeat}.icon-button{width:3rem;min-height:3rem;display:grid;place-items:center;border-radius:50%;padding:0}.icon-button .icon{width:1.59rem;height:1.59rem}.icon-button.round{background:var(--surface)}.icon-button:active .icon{scale:.94;opacity:.8}.icon-button .icon{transition:scale 120ms var(--ease)}
.content{overflow:auto;overscroll-behavior:contain;padding:1rem var(--gutter) 1.5rem;min-width:0;scrollbar-width:none}.content>*+*{margin-top:1.5rem}.display{font-size:2rem;line-height:1.2;font-weight:800;letter-spacing:-.045em}.support{font-size:.9375rem;line-height:1.55;font-weight:500;color:var(--sub)}.display+.support{margin-top:.65rem}.section-title{font-size:1.125rem;font-weight:740;letter-spacing:-.028em;margin-bottom:.75rem}.group{display:grid;gap:.625rem}.surface{background:var(--surface);border-radius:1.5rem;padding:1.25rem;display:grid;gap:.75rem}.action-row{min-height:3.75rem;border-radius:1.25rem;background:var(--soft);display:flex;align-items:center;gap:.875rem;padding:1rem 1.25rem;width:100%;text-align:left;font-size:1rem;font-weight:700}.action-row>span:not(.icon){flex:1;min-width:0}.action-row small{display:block;font-size:.875rem;font-weight:500;color:var(--sub);line-height:1.5;margin-top:.2rem}.action-row .icon{width:1.375rem;height:1.375rem}.action-row .trailing{width:1rem;height:1rem;color:var(--sub)}.cta{width:100%;min-height:3.625rem;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:999px;padding:.875rem 1.5rem;font-size:1.0625rem;font-weight:700;background:var(--fg);color:var(--canvas);transition:filter 120ms var(--ease),background 160ms var(--ease)}.cta.brand{background:var(--brand);color:var(--on-brand)}.cta.weak{background:var(--soft);color:var(--fg)}.cta:active,.action-row:active{filter:brightness(.9)}.field{display:grid;gap:.5rem;font-weight:650}.field input{width:100%;min-height:3.5rem;border:0;border-radius:1rem;background:var(--surface);padding:1rem;color:var(--fg)}
.bottom{background:var(--canvas);padding-bottom:env(safe-area-inset-bottom,0px)}.footer-actions{padding:.625rem var(--gutter) .875rem}.nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:.25rem .5rem .4rem;gap:0;background:var(--canvas);min-height:3.9525rem}.nav button{min-width:0;min-height:3rem;display:grid;justify-items:center;align-content:center;gap:.2325rem;padding:.25rem 0;color:var(--sub);font-size:.6975rem;font-weight:650;overflow-wrap:anywhere}.nav .icon{width:1.56938rem;height:1.56938rem}.nav button[aria-current=page]{color:var(--brand);font-weight:750}
dialog{border:0;color:var(--fg);background:var(--surface);margin:auto;max-width:calc(100% - 2rem);padding:1.25rem;border-radius:1.5rem;width:min(100%,22rem);max-height:85dvh;overflow:auto}dialog::backdrop{background:#0009}dialog[open]{animation:dialog-in 320ms var(--ease)}dialog h2{font-size:1.5rem;font-weight:800;letter-spacing:-.035em}dialog p{margin:.6rem 0 1.25rem}.sheet{position:fixed;inset:auto 0 0;margin:0 auto;width:min(100%,35rem);max-width:none;max-height:75dvh;padding:0 var(--gutter) env(safe-area-inset-bottom,0px);border-radius:1.875rem 1.875rem 0 0;overflow:hidden}.sheet[open]{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:.75rem;animation:sheet-in 320ms var(--ease)}.sheet[data-snap=mid]{height:65dvh;max-height:65dvh}.sheet[data-snap=full]{height:calc(100dvh - env(safe-area-inset-top,0px));max-height:calc(100dvh - env(safe-area-inset-top,0px))}.grip{height:2rem;width:100%;display:grid;place-items:center;touch-action:none}.grip::after{content:"";width:2.5rem;height:.28rem;border-radius:99px;background:var(--sub);opacity:.55}.sheet h2{font-size:1.5625rem}.sheet-body{overflow:auto;display:grid;gap:.625rem;align-content:start;padding-bottom:.25rem}.sheet-footer{padding:.25rem 0 .875rem}.switch{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:3rem;position:relative;font-weight:650}.switch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer}.track{width:2.9375rem;height:1.75rem;padding:.1875rem;border-radius:999px;background:var(--line);flex:none;pointer-events:none;transition:background 160ms var(--ease)}.track::before{content:"";display:block;width:1.375rem;height:1.375rem;background:var(--sub);border-radius:50%;transition:transform 160ms var(--ease)}.switch input:checked+.track{background:var(--fg)}.switch input:checked+.track::before{background:var(--canvas);transform:translateX(1.1875rem)}.switch input:focus-visible+.track{outline:2px solid var(--brand);outline-offset:3px}
@keyframes sheet-in{from{opacity:.6;transform:translateY(1.5rem)}to{opacity:1;transform:none}}@keyframes dialog-in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}.content.enter{animation:page-in 180ms var(--ease)}@keyframes page-in{from{opacity:.55;transform:translateY(.3rem)}to{opacity:1;transform:none}}
@supports(transition-behavior:allow-discrete) and (overlay:auto){dialog{opacity:0;translate:0 .5rem;transition:opacity 180ms,translate 180ms var(--ease),display 180ms allow-discrete,overlay 180ms allow-discrete}dialog[open]{opacity:1;translate:0 0;transition-duration:320ms;animation:none}.sheet{translate:0 100%}.sheet[open]{translate:0 0;animation:none}dialog::backdrop{opacity:0;transition:opacity 180ms,display 180ms allow-discrete,overlay 180ms allow-discrete}dialog[open]::backdrop{opacity:1;transition-duration:320ms}@starting-style{dialog[open]{opacity:0;translate:0 .5rem}.sheet[open]{translate:0 100%}dialog[open]::backdrop{opacity:0}}dialog:not([open]),dialog:not([open])::backdrop{pointer-events:none}}
@media(max-width:359px){:root{--gutter:1rem}.head.root h1,.display{font-size:1.75rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body>
<div class="shell" id="shell"><header class="header" id="header"></header><main id="content" class="content" tabindex="-1"></main><div class="bottom" id="bottom"><div id="footer" class="footer-actions" hidden></div><nav id="nav" class="nav" aria-label="주 메뉴"></nav></div></div>
<dialog id="sheet" class="sheet" aria-labelledby="sheet-title" data-snap="min"><button class="grip" aria-label="시트 높이 변경" id="grip"></button><h2 id="sheet-title">표시 설정</h2><div class="sheet-body"><p class="support">현재 페이지를 유지한 채 설정을 바꿀 수 있어요.</p><label class="switch">다크 모드<input id="theme" type="checkbox" role="switch" checked><span class="track"></span></label><div class="group" id="sheetChoices"></div></div><div class="sheet-footer"><button class="cta" data-close>닫기</button></div></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">템플릿 확인</h2><p class="support">실제 데이터는 변경되지 않아요.</p><button class="cta" data-close>확인</button></dialog>
<script>
"use strict";
// S-PAGE K10: visibility is owned here, not in page content.
const PAGE_TYPES=Object.freeze({global:{header:"root",nav:true},"global-inner":{header:"standard",nav:true},"non-global":{header:"standard",nav:false}});
const destinations=[["home","홈","home","home-fill"],["quests","퀘스트","check-circle","check-circle-fill"],["dm","디엠","chat","chat-fill"],["clan","클랜","bookmark","clan-bookmark-fill"],["me","마이","me-smile","me-smile-fill"]];
const previewIcons=new Set(["clan-bookmark-fill","me-smile","me-smile-fill","bell-connected"]);
const embeddedIcons={}; // standalone export may supply original SVG data URLs
const iconPath=n=>embeddedIcons[n]||"../../assets/icons/"+(previewIcons.has(n)?"preview/":"soft/v0.14/")+n+".svg";
const icon=n=>'<span class="icon" aria-hidden="true" style="--icon:url(&quot;'+iconPath(n)+'&quot;)"></span>';
const ib=(name,label,action,round=false)=>'<button class="icon-button'+(round?' round':'')+'" aria-label="'+label+'" data-action="'+action+'">'+icon(name)+'</button>';
const row=(title,desc,glyph,action)=>'<button class="action-row" data-action="'+action+'">'+icon(glyph)+'<span>'+title+(desc?'<small>'+desc+'</small>':'')+'</span><span class="icon trailing" aria-hidden="true" style="--icon:url(&quot;'+iconPath("chevron")+'&quot;)"></span></button>';
const cta=(label,tone,action)=>'<button class="cta '+tone+'" data-action="'+action+'">'+label+'</button>';
const $=id=>document.getElementById(id);
const roots=Object.fromEntries(destinations.map(([key,label])=>[key,{type:"global",owner:key,title:label,body:()=>'<div><h2 class="display">페이지의 시작</h2><p class="support">공통 페이지 골격을 확인하는 임시 콘텐츠예요.</p></div><section><h2 class="section-title">탐색</h2><div class="group">'+row("내부 페이지","하단 메뉴와 소속 탭 유지","check-circle","inner")+row("독립 페이지","하단 메뉴 없이 작업","bookmark","focus")+row("바텀시트","현재 페이지 위에서 설정","more","sheet")+'</div></section><section class="surface"><h2 class="section-title">본문 영역</h2><p class="support">각 제품 화면의 정보와 콘텐츠는 이후 이 자리에 개별 구성합니다.</p></section>',footer:null}]));
// Replace individual body/slots later. Do not create per-page copies of the shell.
const fixtures={
 inner:{type:"global-inner",title:"내부 페이지",align:"center",body:()=>'<div><h2 class="display">이어지는 탐색</h2><p class="support">상단은 상세 헤더로 바뀌고 하단 메뉴는 유지돼요.</p></div><div class="group">'+row("표시 설정","","more","sheet")+'</div><section class="surface"><h2 class="section-title">본문 영역</h2><p class="support">고정 행동이 있어도 본문은 별도로 스크롤돼요.</p></section>',footer:{label:"다음",tone:"",action:"focus"}},
 focus:{type:"non-global",title:"독립 페이지",align:"start",body:()=>'<div><h2 class="display">한 가지 작업에<br>집중해요</h2><p class="support">하단 메뉴를 숨기고 대표 행동만 남기는 틀이에요.</p></div><label class="field">제목<input id="draft" placeholder="입력해 보기" maxlength="80"></label><div class="group">'+row("표시 설정","","more","sheet")+'</div>',footer:{label:"적용하기",tone:"brand",action:"confirm"}}
};
let stack=[{key:"home",owner:"home",scroll:0,draft:""}],tabs={};let active=stack[0],lastTrigger=null;
function model(s){return roots[s.key]||Object.assign({},fixtures[s.key],{owner:s.owner})}
function save(){active.scroll=$("content").scrollTop;active.draft=$("draft")?.value||""}
function route(key){if($("sheet").open)$("sheet").close();save();const owner=active.owner;if(roots[key]){tabs[owner]=stack;stack=tabs[key]||[{key,owner:key,scroll:0,draft:""}]}else stack.push({key,owner,scroll:0,draft:""});active=stack.at(-1);render()}
function back(){save();if(stack.length>1)stack.pop();else stack=[{key:active.owner,owner:active.owner,scroll:0,draft:""}];active=stack.at(-1);render()}
function render(){const p=model(active),type=PAGE_TYPES[p.type];$("shell").dataset.pageType=p.type;
 const header=type.header==="root"?'<div class="head root"><h1>'+p.title+'</h1><div class="end">'+ib("bell-connected","알림 및 표시 설정","sheet")+'</div></div>':'<div class="head standard" data-align="'+(p.align||"center")+'">'+ib("left","뒤로 가기","back",p.type==="non-global")+'<h1>'+p.title+'</h1><div class="end">'+ib("more","표시 설정","sheet")+'</div></div>';
 $("header").innerHTML=header;$("content").innerHTML=p.body();if($("draft"))$("draft").value=active.draft||"";
 $("content").scrollTop=active.scroll||0;$("content").classList.remove("enter");void $("content").offsetWidth;$("content").classList.add("enter");
 $("footer").hidden=!p.footer;$("footer").innerHTML=p.footer?cta(p.footer.label,p.footer.tone,p.footer.action):"";
 $("nav").hidden=!type.nav;$("nav").innerHTML=destinations.map(([key,label,off,on])=>'<button data-action="tab:'+key+'" '+(key===p.owner?'aria-current="page"':'')+'>'+icon(key===p.owner?on:off)+'<span>'+label+'</span></button>').join("");
}
function showSheet(trigger){lastTrigger=trigger;$("sheet").dataset.snap="min";$("theme").checked=document.documentElement.dataset.theme==="dark";$("sheet").showModal()}
function snap(step){const d=$("sheet"),sizes=["min","mid","full"],i=sizes.indexOf(d.dataset.snap)+step;if(i<0)d.close();else d.dataset.snap=sizes[Math.min(2,i)]}
$("sheetChoices").innerHTML=row("중간 높이","","chevron","snap-mid")+row("전체 높이","","chevron","snap-full");
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.action;if(b.hasAttribute("data-close")){b.closest("dialog").close();return}if(!a)return;if(a.startsWith("tab:")){route(a.slice(4));return}if(a==="back")back();else if(a==="sheet")showSheet(b);else if(a==="confirm")$("confirm").showModal();else if(a==="snap-mid"||a==="snap-full")$("sheet").dataset.snap=a.slice(5);else if(fixtures[a])route(a)});
$("theme").addEventListener("change",e=>document.documentElement.dataset.theme=e.target.checked?"dark":"light");
$("sheet").addEventListener("close",()=>{if(lastTrigger?.isConnected)lastTrigger.focus({preventScroll:true})});
for(const d of document.querySelectorAll("dialog"))d.addEventListener("click",e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientY<r.top||e.clientY>r.bottom||e.clientX<r.left||e.clientX>r.right)d.close()});
let start=null,moved=false;const grip=$("grip");grip.addEventListener("pointerdown",e=>{start=e.clientY;moved=false;grip.setPointerCapture(e.pointerId)});grip.addEventListener("pointerup",e=>{if(start===null)return;const dy=e.clientY-start;start=null;if(Math.abs(dy)>24){moved=true;snap(dy<0?1:-1)}});grip.addEventListener("pointercancel",()=>{start=null;moved=false});grip.addEventListener("click",()=>{if(!moved)snap(1);moved=false});grip.addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();snap(e.key==="ArrowUp"?1:-1)}});
render();
</script></body></html>
